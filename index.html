<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HeiKasir - Owner Dashboard</title>
    <!-- Tailwind CSS + Font Awesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-storage-compat.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* Custom styling */
        .bottom-nav {
            backdrop-filter: blur(8px);
            background-color: rgba(255,255,255,0.9);
            border-top: 1px solid #e5e7eb;
        }
        .dark .bottom-nav {
            background-color: rgba(31,41,55,0.9);
            border-top-color: #374151;
        }
        .card-hover {
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .card-hover:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
        }
        .modal-overlay {
            transition: opacity 0.2s;
        }
        .spinner {
            border: 3px solid rgba(0,31,63,0.2);
            border-top: 3px solid #001f3f;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .tab {
            cursor: pointer;
            padding: 0.5rem 1rem;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .tab.active {
            border-bottom-color: #001f3f;
            font-weight: 600;
        }
        .dark .tab.active {
            border-bottom-color: #60a5fa;
        }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-200 font-sans antialiased">

<!-- Overlay Lisensi -->
<div id="lockOverlay" class="hidden fixed inset-0 bg-white dark:bg-gray-900 bg-opacity-95 z-50 flex flex-col items-center justify-center">
    <i class="fas fa-lock text-6xl text-navy-800 dark:text-navy-400 mb-4"></i>
    <h2 class="text-2xl font-bold mb-2">Akses Terkunci</h2>
    <p id="lockMessage" class="text-gray-600 dark:text-gray-400 mb-4">Lisensi tidak aktif</p>
    <button onclick="window.location.reload()" class="bg-navy-800 hover:bg-navy-900 text-white px-4 py-2 rounded-lg">Coba Lagi</button>
</div>

<!-- Modal Container -->
<div id="modalContainer" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4 modal-overlay">
    <div id="modalContent" class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl w-full max-w-md max-h-[90vh] overflow-y-auto p-6"></div>
</div>

<!-- Loading Overlay -->
<div id="loadingOverlay" class="hidden fixed inset-0 bg-white dark:bg-gray-900 bg-opacity-80 z-50 flex items-center justify-center">
    <div class="spinner"></div>
</div>

<!-- Dark Mode Toggle (optional) -->
<div class="fixed top-4 right-4 z-50">
    <button id="darkModeToggle" class="bg-gray-200 dark:bg-gray-700 p-2 rounded-full">
        <i class="fas fa-moon dark:hidden"></i>
        <i class="fas fa-sun hidden dark:inline"></i>
    </button>
</div>

<!-- Konten Utama (setelah login & lisensi aktif) -->
<div id="appContent" class="hidden min-h-screen pb-20">
    <!-- Header -->
    <nav class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center">
                    <span class="text-xl font-bold text-navy-800 dark:text-white">HeiKasir Owner</span>
                </div>
                <div class="hidden md:flex space-x-2">
                    <button class="nav-btn px-3 py-2 rounded-md text-sm font-medium" data-page="dashboard">Dashboard</button>
                    <button class="nav-btn px-3 py-2 rounded-md text-sm font-medium" data-page="outlets">Outlet</button>
                    <button class="nav-btn px-3 py-2 rounded-md text-sm font-medium" data-page="employees">Pegawai</button>
                    <button class="nav-btn px-3 py-2 rounded-md text-sm font-medium" data-page="menu">Menu</button>
                    <button class="nav-btn px-3 py-2 rounded-md text-sm font-medium" data-page="stock">Stok</button>
                    <button class="nav-btn px-3 py-2 rounded-md text-sm font-medium" data-page="expenses">Pengeluaran</button>
                    <button class="nav-btn px-3 py-2 rounded-md text-sm font-medium" data-page="reports">Laporan</button>
                    <button class="nav-btn px-3 py-2 rounded-md text-sm font-medium" data-page="profile">Profil</button>
                </div>
                <button id="logoutBtn" class="text-sm text-red-600 hover:text-red-800 dark:text-red-400">
                    <i class="fas fa-sign-out-alt mr-1"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Bottom Navigation untuk mobile -->
    <div class="bottom-nav fixed bottom-0 left-0 right-0 md:hidden flex justify-around p-2 z-50">
        <button class="nav-item flex flex-col items-center p-2 text-xs" data-page="dashboard"><i class="fas fa-home text-xl mb-1"></i><span>Home</span></button>
        <button class="nav-item flex flex-col items-center p-2 text-xs" data-page="outlets"><i class="fas fa-store text-xl mb-1"></i><span>Outlet</span></button>
        <button class="nav-item flex flex-col items-center p-2 text-xs" data-page="employees"><i class="fas fa-users text-xl mb-1"></i><span>Pegawai</span></button>
        <button class="nav-item flex flex-col items-center p-2 text-xs" data-page="menu"><i class="fas fa-utensils text-xl mb-1"></i><span>Menu</span></button>
        <button class="nav-item flex flex-col items-center p-2 text-xs" data-page="stock"><i class="fas fa-boxes text-xl mb-1"></i><span>Stok</span></button>
        <button class="nav-item flex flex-col items-center p-2 text-xs" data-page="expenses"><i class="fas fa-money-bill text-xl mb-1"></i><span>Biaya</span></button>
        <button class="nav-item flex flex-col items-center p-2 text-xs" data-page="reports"><i class="fas fa-chart-bar text-xl mb-1"></i><span>Laporan</span></button>
        <button class="nav-item flex flex-col items-center p-2 text-xs" data-page="profile"><i class="fas fa-user text-xl mb-1"></i><span>Profil</span></button>
    </div>

    <!-- Halaman konten dinamis -->
    <main id="pageContent" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6"></main>
</div>

<!-- Halaman Login/Registrasi -->
<div id="authContainer" class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-navy-900 to-blue-900">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl max-w-md w-full p-8">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-navy-800 dark:text-white">HeiKasir</h1>
            <p class="text-gray-500 dark:text-gray-400">Owner Panel</p>
        </div>
        <div class="flex mb-4 border-b dark:border-gray-700">
            <button id="tabLogin" class="flex-1 py-2 text-center font-medium border-b-2 border-navy-800 dark:border-navy-400">Masuk</button>
            <button id="tabRegister" class="flex-1 py-2 text-center font-medium text-gray-500">Daftar</button>
        </div>
        <!-- Form Login -->
        <div id="loginForm" class="space-y-4">
            <input type="email" id="loginEmail" placeholder="Email" class="w-full p-3 border dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700">
            <input type="password" id="loginPassword" placeholder="Password" class="w-full p-3 border dark:border-gray-600 rounded-lg bg-white dark:bg-gray-700">
            <button id="loginBtn" class="w-full bg-navy-800 hover:bg-navy-900 text-white py-3 rounded-lg font-semibold">Masuk</button>
            <p class="text-sm text-center text-gray-500"><a href="#" onclick="resetPassword()" class="text-navy-800 dark:text-navy-400">Lupa password?</a></p>
        </div>
        <!-- Form Registrasi -->
        <div id="registerForm" class="space-y-4 hidden">
            <input type="text" id="regName" placeholder="Nama Lengkap" class="w-full p-3 border dark:border-gray-600 rounded-lg">
            <input type="email" id="regEmail" placeholder="Email" class="w-full p-3 border dark:border-gray-600 rounded-lg">
            <input type="tel" id="regPhone" placeholder="Nomor WA" class="w-full p-3 border dark:border-gray-600 rounded-lg">
            <input type="password" id="regPassword" placeholder="Password (min. 6)" class="w-full p-3 border dark:border-gray-600 rounded-lg">
            <input type="password" id="regConfirm" placeholder="Konfirmasi Password" class="w-full p-3 border dark:border-gray-600 rounded-lg">
            <button id="registerBtn" class="w-full bg-navy-800 hover:bg-navy-900 text-white py-3 rounded-lg font-semibold">Daftar</button>
        </div>
    </div>
</div>

<script>
    // ==================== KONFIGURASI FIREBASE ====================
    const firebaseConfig = {
        apiKey: "AIzaSyBkoz3onX4IRWium_QUjq-Nf-pnNsiMRU8",
        authDomain: "heikasir.firebaseapp.com",
        projectId: "heikasir",
        storageBucket: "heikasir.firebasestorage.app",
        messagingSenderId: "246718427847",
        appId: "1:246718427847:web:4912ff8280132f71c344e2"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    // ==================== STATE GLOBAL ====================
    let currentUser = null;
    let currentOwnerId = null;
    let currentPage = 'dashboard';
    let incomeChart = null;

    // Elemen DOM
    const authContainer = document.getElementById('authContainer');
    const appContent = document.getElementById('appContent');
    const lockOverlay = document.getElementById('lockOverlay');
    const lockMessage = document.getElementById('lockMessage');
    const pageContent = document.getElementById('pageContent');
    const modalContainer = document.getElementById('modalContainer');
    const modalContent = document.getElementById('modalContent');
    const loadingOverlay = document.getElementById('loadingOverlay');

    // ==================== UTILITY ====================
    function showLoading() { loadingOverlay.classList.remove('hidden'); }
    function hideLoading() { loadingOverlay.classList.add('hidden'); }
    function showModal(html) { modalContent.innerHTML = html; modalContainer.classList.remove('hidden'); }
    function closeModal() { modalContainer.classList.add('hidden'); }
    modalContainer.addEventListener('click', (e) => { if (e.target === modalContainer) closeModal(); });

    function formatRupiah(angka) {
        return 'Rp ' + angka.toLocaleString('id-ID');
    }
    function formatDate(timestamp) {
        if (!timestamp) return '-';
        const d = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
        return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
    }
    function formatDateTime(timestamp) {
        if (!timestamp) return '-';
        const d = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
        return d.toLocaleString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    // ==================== DARK MODE ====================
    const darkModeToggle = document.getElementById('darkModeToggle');
    if (localStorage.getItem('darkMode') === 'true') {
        document.documentElement.classList.add('dark');
    }
    darkModeToggle.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
        localStorage.setItem('darkMode', document.documentElement.classList.contains('dark'));
    });

    // ==================== AUTH LISTENER ====================
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentUser = user;
            currentOwnerId = user.uid;
            const valid = await checkLicense();
            if (valid) {
                authContainer.classList.add('hidden');
                appContent.classList.remove('hidden');
                setActiveNav(currentPage);
                loadPage(currentPage);
            } else {
                authContainer.classList.add('hidden');
                appContent.classList.remove('hidden');
                lockOverlay.classList.remove('hidden');
            }
        } else {
            authContainer.classList.remove('hidden');
            appContent.classList.add('hidden');
            lockOverlay.classList.add('hidden');
        }
    });

    // ==================== CEK LISENSI ====================
    async function checkLicense() {
        if (!currentUser) return false;
        try {
            const doc = await db.collection('Master_Owners').doc(currentUser.uid).get();
            if (!doc.exists) {
                lockMessage.innerText = 'Data owner tidak ditemukan. Hubungi developer.';
                return false;
            }
            const data = doc.data();
            const expiry = data.expiryDate ? data.expiryDate.toDate() : new Date(0);
            const now = new Date();
            if (data.status !== 'active') {
                lockMessage.innerText = 'Lisensi belum aktif. Hubungi developer.';
                return false;
            }
            if (expiry < now) {
                lockMessage.innerText = 'Masa aktif lisensi telah habis.';
                return false;
            }
            localStorage.setItem('hei_license', JSON.stringify({ expiry: expiry.getTime(), status: data.status }));
            return true;
        } catch (e) {
            console.error(e);
            lockMessage.innerText = 'Gagal memeriksa lisensi. Periksa koneksi.';
            return false;
        }
    }

    // ==================== NAVIGASI ====================
    document.querySelectorAll('.nav-btn, .nav-item').forEach(btn => {
        btn.addEventListener('click', () => {
            const page = btn.dataset.page;
            if (!page) return;
            currentPage = page;
            setActiveNav(page);
            loadPage(page);
        });
    });
    function setActiveNav(page) {
        document.querySelectorAll('.nav-btn, .nav-item').forEach(el => {
            el.classList.remove('bg-navy-100', 'text-navy-800', 'dark:bg-gray-700', 'dark:text-white');
        });
        document.querySelectorAll(`[data-page="${page}"]`).forEach(el => {
            el.classList.add('bg-navy-100', 'text-navy-800', 'dark:bg-gray-700', 'dark:text-white');
        });
    }

    async function loadPage(page) {
        showLoading();
        try {
            switch(page) {
                case 'dashboard': await renderDashboard(); break;
                case 'outlets': await renderOutlets(); break;
                case 'employees': await renderEmployees(); break;
                case 'menu': await renderMenu(); break;
                case 'stock': await renderStock(); break;
                case 'expenses': await renderExpenses(); break;
                case 'reports': await renderReports(); break;
                case 'profile': await renderProfile(); break;
                default: await renderDashboard();
            }
        } catch (error) {
            console.error(error);
            alert('Gagal memuat halaman: ' + error.message);
        } finally {
            hideLoading();
        }
    }

    // ==================== DASHBOARD ====================
    let incomeToday = 0, expenseToday = 0, profitToday = 0, voidToday = 0;
    let unsubTrans = null, unsubExp = null;

    async function renderDashboard() {
        // Bersihkan listener sebelumnya
        if (unsubTrans) unsubTrans();
        if (unsubExp) unsubExp();

        pageContent.innerHTML = `
            <h1 class="text-2xl font-bold mb-6">Dashboard</h1>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow card-hover">
                    <div class="flex justify-between"><span class="text-gray-500">Pemasukan</span><i class="fas fa-arrow-up text-green-500"></i></div>
                    <div class="text-2xl font-bold" id="incomeToday">Rp 0</div>
                </div>
                <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow card-hover">
                    <div class="flex justify-between"><span class="text-gray-500">Pengeluaran</span><i class="fas fa-arrow-down text-red-500"></i></div>
                    <div class="text-2xl font-bold" id="expenseToday">Rp 0</div>
                </div>
                <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow card-hover">
                    <div class="flex justify-between"><span class="text-gray-500">Profit</span><i class="fas fa-chart-line text-blue-500"></i></div>
                    <div class="text-2xl font-bold" id="profitToday">Rp 0</div>
                </div>
                <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow card-hover">
                    <div class="flex justify-between"><span class="text-gray-500">Void</span><i class="fas fa-times text-red-500"></i></div>
                    <div class="text-2xl font-bold" id="voidToday">0</div>
                </div>
            </div>
            <div class="grid md:grid-cols-2 gap-6 mb-6">
                <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow">
                    <h2 class="font-semibold mb-2">Perkembangan 7 Hari</h2>
                    <canvas id="incomeChart" height="200"></canvas>
                </div>
                <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow">
                    <h2 class="font-semibold mb-2">Menu Favorit</h2>
                    <ul id="topMenuList" class="space-y-2"></ul>
                </div>
            </div>
            <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow">
                <h2 class="font-semibold mb-2">Stok Menipis</h2>
                <div id="stockLimitList" class="space-y-2"></div>
            </div>
        `;

        const today = new Date(); today.setHours(0,0,0,0);
        const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);

        unsubTrans = db.collection('Owners').doc(currentOwnerId).collection('Transactions')
            .where('timestamp', '>=', today).where('timestamp', '<', tomorrow)
            .onSnapshot(snapshot => {
                incomeToday = 0; voidToday = 0;
                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (!data.isVoid) incomeToday += data.totalPayment || 0;
                    else voidToday++;
                });
                updateDashboardNumbers();
            }, error => console.error(error));

        unsubExp = db.collection('Owners').doc(currentOwnerId).collection('Expenses')
            .where('timestamp', '>=', today).where('timestamp', '<', tomorrow)
            .where('isStockPurchase', '==', false)
            .onSnapshot(snapshot => {
                expenseToday = 0;
                snapshot.forEach(doc => expenseToday += doc.data().amount || 0);
                updateDashboardNumbers();
            }, error => console.error(error));

        await loadChartData();
        await loadTopMenu();
        await loadStockLimit();

        function updateDashboardNumbers() {
            profitToday = incomeToday - expenseToday;
            document.getElementById('incomeToday').innerText = formatRupiah(incomeToday);
            document.getElementById('expenseToday').innerText = formatRupiah(expenseToday);
            document.getElementById('profitToday').innerText = formatRupiah(profitToday);
            document.getElementById('voidToday').innerText = voidToday;
        }
    }

    async function loadChartData() {
        const labels = [], data = [];
        for (let i = 6; i >= 0; i--) {
            const d = new Date(); d.setDate(d.getDate() - i); d.setHours(0,0,0,0);
            const next = new Date(d); next.setDate(d.getDate() + 1);
            labels.push(d.toLocaleDateString('id-ID', { weekday:'short', day:'numeric' }));
            const snap = await db.collection('Owners').doc(currentOwnerId).collection('Transactions')
                .where('timestamp', '>=', d).where('timestamp', '<', next).where('isVoid', '==', false).get();
            let total = 0;
            snap.forEach(doc => total += doc.data().totalPayment || 0);
            data.push(total);
        }
        if (incomeChart) incomeChart.destroy();
        const ctx = document.getElementById('incomeChart').getContext('2d');
        incomeChart = new Chart(ctx, {
            type: 'line',
            data: { labels, datasets: [{ label: 'Pemasukan', data, borderColor: '#001f3f', backgroundColor: 'rgba(0,31,63,0.1)', tension: 0.3 }] },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });
    }

    async function loadTopMenu() {
        const thirtyDaysAgo = new Date(); thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
        const snap = await db.collection('Owners').doc(currentOwnerId).collection('Transactions')
            .where('timestamp', '>=', thirtyDaysAgo).where('isVoid', '==', false).get();
        const menuCount = {};
        snap.forEach(doc => {
            (doc.data().items || []).forEach(item => {
                menuCount[item.name] = (menuCount[item.name] || 0) + item.qty;
            });
        });
        const sorted = Object.entries(menuCount).sort((a,b) => b[1] - a[1]).slice(0,5);
        const list = document.getElementById('topMenuList');
        list.innerHTML = sorted.map(([name, qty]) => `<li class="flex justify-between"><span>${name}</span><span class="font-semibold">${qty} terjual</span></li>`).join('');
    }

    async function loadStockLimit() {
        const snap = await db.collection('Owners').doc(currentOwnerId).collection('Ingredients').get();
        const list = document.getElementById('stockLimitList');
        list.innerHTML = '';
        snap.forEach(doc => {
            const ing = doc.data();
            if (ing.currentStock <= ing.minStock) {
                list.innerHTML += `
                    <div class="flex justify-between items-center">
                        <span>${ing.name} (${ing.currentStock} ${ing.unit})</span>
                        <button onclick="showStockInModal('${doc.id}')" class="text-sm bg-navy-100 hover:bg-navy-200 text-navy-800 px-3 py-1 rounded-full">Stok Masuk</button>
                    </div>
                `;
            }
        });
    }

    // ==================== OUTLET ====================
    async function renderOutlets() {
        pageContent.innerHTML = `
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold">Outlet</h1>
                <button onclick="showAddOutletModal()" class="bg-navy-800 hover:bg-navy-900 text-white px-4 py-2 rounded-lg flex items-center"><i class="fas fa-plus mr-2"></i>Tambah Outlet</button>
            </div>
            <div id="outletGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        `;
        await loadOutlets();
    }

    async function loadOutlets() {
        const snap = await db.collection('Owners').doc(currentOwnerId).collection('Outlets').get();
        const grid = document.getElementById('outletGrid');
        if (!grid) return;
        if (snap.empty) {
            grid.innerHTML = '<p class="col-span-full text-center text-gray-500">Belum ada outlet. Tambahkan outlet pertama Anda.</p>';
            return;
        }
        grid.innerHTML = '';
        snap.forEach(doc => {
            const outlet = doc.data();
            grid.innerHTML += `
                <div class="bg-white dark:bg-gray-800 p-4 rounded-lg shadow">
                    <h3 class="font-bold">${outlet.name}</h3>
                    <p class="text-sm text-gray-600 dark:text-gray-400">${outlet.address || '-'}</p>
                    <p class="text-sm">Stok: ${outlet.stockMode == 'global' ? 'Global' : 'Lokal'}</p>
                    <div class="flex mt-3 space-x-2">
                        <button onclick="editOutlet('${doc.id}')" class="text-blue-600 hover:text-blue-800"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteOutlet('${doc.id}')" class="text-red-600 hover:text-red-800"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `;
        });
    }

    window.showAddOutletModal = function() {
        showModal(`

    window.saveMenu = async function() {
        const name = document.getElementById('menuName').value.trim();
        const category = document.getElementById('menuCategory').value;
        const unit = document.getElementById('menuUnit').value;
        const variant = document.getElementById('menuVariant').value;
        const prices = {
            tunai: parseFloat(document.getElementById('priceTunai').value) || 0,
            transfer: parseFloat(document.getElementById('priceTransfer').value) || 0,
            gofood: parseFloat(document.getElementById('priceGofood').value) || 0,
            shopeefood: parseFloat(document.getElementById('priceShopeefood').value) || 0
        };
        const discounts = {
            gofood: parseFloat(document.getElementById('discountGofood').value) || 0,
            shopeefood: parseFloat(document.getElementById('discountShopeefood').value) || 0
        };
        const taxPpn = parseFloat(document.getElementById('taxPpn').value) || 0;

        const recipe = [];
        document.querySelectorAll('#recipeContainer .flex').forEach(row => {
            const ingSelect = row.querySelector('.recipe-ingredient');
            const qty = parseFloat(row.querySelector('.recipe-qty').value);
            if (ingSelect.value && qty) {
                recipe.push({ ingId: ingSelect.value, qty });
            }
        });

        // Hitung HPP sementara
        let hpp = 0;
        for (let item of recipe) {
            const ingDoc = await db.collection('Owners').doc(currentOwnerId).collection('Ingredients').doc(item.ingId).get();
            if (ingDoc.exists) {
                hpp += (ingDoc.data().avgBuyPrice || 0) * item.qty;
            }
        }
        document.getElementById('calculatedHpp').value = hpp;

        try {
            showLoading();
            await db.collection('Owners').doc(currentOwnerId).collection('Menu').add({
                name, category, unit, variant, prices, discounts, taxPpn, recipe,
                calculatedHpp: hpp,
                gridIndex: 0,
                isActive: true,
                imageUrl: '',
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            closeModal();
            loadMenuList();
        } catch (e) {
            alert('Gagal: ' + e.message);
        } finally {
            hideLoading();
        }
    };

    window.syncHpp = async function() {
        try {
            showLoading();
            const menusSnap = await db.collection('Owners').doc(currentOwnerId).collection('Menu').get();
            const batch = db.batch();
            for (const doc of menusSnap.docs) {
                const menu = doc.data();
                let hpp = 0;
                if (menu.recipe) {
                    for (const item of menu.recipe) {
                        const ingDoc = await db.collection('Owners').doc(currentOwnerId).collection('Ingredients').doc(item.ingId).get();
                        if (ingDoc.exists) {
                            hpp += (ingDoc.data().avgBuyPrice || 0) * item.qty;
                        }
                    }
                }
                batch.update(doc.ref, { calculatedHpp: hpp });
            }
            await batch.commit();
            alert('HPP semua menu telah disinkronisasi');
        } catch (e) {
            alert('Gagal: ' + e.message);
        } finally {
            hideLoading();
        }
    };

    window.processStockIn = async function(ingId) {
        const qty = parseFloat(document.getElementById('stockQty').value);
        const price = parseFloat(document.getElementById('stockPrice').value);
        const notes = document.getElementById('stockNotes').value.trim();
        if (!qty || !price) return alert('Isi jumlah dan harga');
        try {
            showLoading();
            const ingRef = db.collection('Owners').doc(currentOwnerId).collection('Ingredients').doc(ingId);
            const ingDoc = await ingRef.get();
            const ing = ingDoc.data();
            const currentStock = ing.currentStock;
            const avgPrice = ing.avgBuyPrice || 0;
            const newAvgPrice = ((currentStock * avgPrice) + (qty * price)) / (currentStock + qty);
            const batch = db.batch();
            batch.update(ingRef, {
                currentStock: currentStock + qty,
                avgBuyPrice: newAvgPrice,
                lastPurchasePrice: price,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            const expRef = db.collection('Owners').doc(currentOwnerId).collection('Expenses').doc();
            batch.set(expRef, {
                expId: expRef.id,
                outletId: 'global',
                category: 'Belanja Stok',
                itemName: `Pembelian ${ing.name}`,
                amount: qty * price,
                isStockPurchase: true,
                stockDetails: { ingId, addedQty: qty, purchasePricePerUnit: price },
                inputBy: 'owner',
                inputById: currentOwnerId,
                notes,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            await batch.commit();
            closeModal();
            loadIngredients();
            loadStockLimit(); // refresh dashboard if visible
        } catch (e) {
            alert('Gagal: ' + e.message);
        } finally {
            hideLoading();
        }
    };

    window.exportExcel = async function() {
        const period = document.getElementById('reportPeriod').value;
        let start, end;
        const now = new Date();
        if (period === 'today') {
            start = new Date(now.setHours(0,0,0,0));
            end = new Date(now.setHours(23,59,59,999));
        } else if (period === 'yesterday') {
            start = new Date(now.setDate(now.getDate()-1)); start.setHours(0,0,0,0);
            end = new Date(now.setHours(23,59,59,999));
        } else if (period === 'week') {
            start = new Date(now.setDate(now.getDate()-7)); start.setHours(0,0,0,0);
            end = new Date();
        } else if (period === 'month') {
            start = new Date(now.getFullYear(), now.getMonth(), 1);
            end = new Date(now.getFullYear(), now.getMonth()+1, 0, 23,59,59);
        } else if (period === 'custom') {
            start = new Date(document.getElementById('startDate').value);
            end = new Date(document.getElementById('endDate').value);
            if (!start || !end) return alert('Pilih tanggal');
            end.setHours(23,59,59);
        }
        showLoading();
        try {
            const transSnap = await db.collection('Owners').doc(currentOwnerId).collection('Transactions')
                .where('timestamp', '>=', start).where('timestamp', '<=', end).get();
            const expensesSnap = await db.collection('Owners').doc(currentOwnerId).collection('Expenses')
                .where('timestamp', '>=', start).where('timestamp', '<=', end).get();
            const ingredientsSnap = await db.collection('Owners').doc(currentOwnerId).collection('Ingredients').get();

            const wb = XLSX.utils.book_new();

            // Sheet Ringkasan
            let totalPenjualan = 0, totalHPP = 0, totalExpense = 0;
            transSnap.forEach(doc => {
                const data = doc.data();
                if (!data.isVoid) {
                    totalPenjualan += data.totalPayment || 0;
                    totalHPP += data.totalHpp || 0;
                }
            });
            expensesSnap.forEach(doc => {
                const data = doc.data();
                if (!data.isStockPurchase) totalExpense += data.amount || 0;
            });
            const labaKotor = totalPenjualan - totalHPP;
            const labaBersih = labaKotor - totalExpense;
            const sheetRingkasan = XLSX.utils.aoa_to_sheet([
                ['Ringkasan Laba Rugi'],
                ['Deskripsi', 'Nilai'],
                ['Total Penjualan', totalPenjualan],
                ['Total HPP Terjual', totalHPP],
                ['Laba Kotor', labaKotor],
                ['Total Pengeluaran', totalExpense],
                ['Laba Bersih', labaBersih]
            ]);
            XLSX.utils.book_append_sheet(wb, sheetRingkasan, 'Ringkasan');

            // Sheet Transaksi
            const transData = [['No Invoice', 'Tanggal', 'Jam', 'Kasir', 'Item', 'Qty', 'Harga', 'Total', 'HPP', 'Profit']];
            transSnap.forEach(doc => {
                const t = doc.data();
                const tgl = t.timestamp ? formatDate(t.timestamp) : '';
                const jam = t.timestamp ? new Date(t.timestamp.seconds*1000).toLocaleTimeString('id-ID') : '';
                t.items.forEach(item => {
                    transData.push([
                        t.invoiceNo, tgl, jam, t.cashierName, item.name, item.qty,
                        item.price, item.subtotal, item.hppAtTime, item.subtotal - (item.hppAtTime * item.qty)
                    ]);
                });
            });
            const sheetTrans = XLSX.utils.aoa_to_sheet(transData);
            XLSX.utils.book_append_sheet(wb, sheetTrans, 'Transaksi');

            // Sheet Pengeluaran
            const expData = [['Tanggal', 'Kategori', 'Keterangan', 'Nominal', 'Tipe']];
            expensesSnap.forEach(doc => {
                const e = doc.data();
                const tgl = e.timestamp ? formatDate(e.timestamp) : '';
                expData.push([tgl, e.category, e.itemName, e.amount, e.isStockPurchase ? 'Aset' : 'Beban']);
            });
            const sheetExp = XLSX.utils.aoa_to_sheet(expData);
            XLSX.utils.book_append_sheet(wb, sheetExp, 'Pengeluaran');

            // Sheet Stok
            const stokData = [['Nama Bahan', 'Satuan', 'Stok Akhir', 'Min Stok']];
            ingredientsSnap.forEach(doc => {
                const i = doc.data();
                stokData.push([i.name, i.unit, i.currentStock, i.minStock]);
            });
            const sheetStok = XLSX.utils.aoa_to_sheet(stokData);
            XLSX.utils.book_append_sheet(wb, sheetStok, 'Stok');

            // Sheet Menu Terjual
            const menuCount = {};
            transSnap.forEach(doc => {
                const t = doc.data();
                if (!t.isVoid) {
                    t.items.forEach(item => {
                        const key = item.name;
                        if (!menuCount[key]) menuCount[key] = { qty:0, omzet:0, hpp:0 };
                        menuCount[key].qty += item.qty;
                        menuCount[key].omzet += item.subtotal;
                        menuCount[key].hpp += (item.hppAtTime * item.qty);
                    });
                }
            });
            const menuData = [['Nama Menu', 'Qty Terjual', 'Omzet', 'HPP', 'Profit']];
            Object.entries(menuCount).forEach(([name, val]) => {
                menuData.push([name, val.qty, val.omzet, val.hpp, val.omzet - val.hpp]);
            });
            const sheetMenu = XLSX.utils.aoa_to_sheet(menuData);
            XLSX.utils.book_append_sheet(wb, sheetMenu, 'Menu Terjual');

            XLSX.writeFile(wb, `laporan_${start.toISOString().slice(0,10)}.xlsx`);
        } catch (e) {
            alert('Gagal ekspor: ' + e.message);
        } finally {
            hideLoading();
        }
    };

                <h2 class="font-bold mb-2">Pengaturan Nota</h2>
                <div class="mb-4">
                    <label class="block mb-1">Ukuran Logo</label>
                    <select id="logoSize" class="w-full p-2 border rounded-lg dark:bg-gray-700">
                        <option value="small">Kecil</option>
                        <option value="medium">Sedang</option>
                        <option value="large">Besar</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block mb-1">Teks Footer</label>
                    <input type="text" id="footerText" class="w-full p-2 border rounded-lg dark:bg-gray-700">
                </div>
                <button onclick="updateReceiptSettings()" class="w-full bg-navy-800 hover:bg-navy-900 text-white py-2 rounded-lg mb-4">Simpan Setting Nota</button>
                <button onclick="logout()" class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded-lg">Logout</button>
            </div>
        `;
        await loadProfile();
    }

    async function loadProfile() {
        if (!currentUser) return;
        document.getElementById('profileEmail').value = currentUser.email;
        const doc = await db.collection('Master_Owners').doc(currentOwnerId).get();
        if (doc.exists) {
            const data = doc.data();
            document.getElementById('profileName').value = data.name || '';
            document.getElementById('profilePhone').value = data.phone || '';
        }
        const settingsDoc = await db.collection('Owners').doc(currentOwnerId).collection('Settings').doc('receipt').get();
        if (settingsDoc.exists) {
            const s = settingsDoc.data();
            document.getElementById('logoSize').value = s.logoSize || 'medium';
            document.getElementById('footerText').value = s.footerText || '';
        }
    }

    window.updateProfile = async function() {
        const name = document.getElementById('profileName').value.trim();
        const phone = document.getElementById('profilePhone').value.trim();
        try {
            showLoading();
            await db.collection('Master_Owners').doc(currentOwnerId).update({ name, phone });
            alert('Profil diperbarui');
        } catch (e) {
            alert('Gagal: ' + e.message);
        } finally {
            hideLoading();
        }
    };

    window.updateReceiptSettings = async function() {
        const logoSize = document.getElementById('logoSize').value;
        const footerText = document.getElementById('footerText').value.trim();
        try {
            showLoading();
            await db.collection('Owners').doc(currentOwnerId).collection('Settings').doc('receipt').set({
                logoSize, footerText, watermark: true, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
            alert('Setting nota disimpan');
        } catch (e) {
            alert('Gagal: ' + e.message);
        } finally {
            hideLoading();
        }
    };

    window.logout = function() {
        if (unsubTrans) unsubTrans();
        if (unsubExp) unsubExp();
        auth.signOut();
    };
    document.getElementById('logoutBtn').addEventListener('click', logout);

    // ==================== AUTH ====================
    document.getElementById('tabLogin').addEventListener('click', () => {
        document.getElementById('tabLogin').classList.add('border-b-2', 'border-navy-800');
        document.getElementById('tabRegister').classList.remove('border-b-2', 'border-navy-800');
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('registerForm').classList.add('hidden');
    });
    document.getElementById('tabRegister').addEventListener('click', () => {
        document.getElementById('tabRegister').classList.add('border-b-2', 'border-navy-800');
        document.getElementById('tabLogin').classList.remove('border-b-2', 'border-navy-800');
        document.getElementById('registerForm').classList.remove('hidden');
        document.getElementById('loginForm').classList.add('hidden');
    });

    document.getElementById('loginBtn').addEventListener('click', async () => {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        if (!email || !password) return alert('Email dan password harus diisi');
        try {
            showLoading();
            await auth.signInWithEmailAndPassword(email, password);
        } catch (e) {
            alert('Login gagal: ' + e.message);
        } finally {
            hideLoading();
        }
    });

    document.getElementById('registerBtn').addEventListener('click', async () => {
        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirm = document.getElementById('regConfirm').value;
        if (!name || !email || !phone || !password || !confirm) return alert('Semua field harus diisi');
        if (password.length < 6) return alert('Password minimal 6 karakter');
        if (password !== confirm) return alert('Password tidak cocok');
        try {
            showLoading();
            const cred = await auth.createUserWithEmailAndPassword(email, password);
            const user = cred.user;
            await db.collection('Master_Owners').doc(user.uid).set({
                ownerId: user.uid,
                email,
                name,
                phone,
                status: 'pending',
                registeredAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert('Registrasi berhasil! Menunggu aktivasi developer.');
            // Reset form dan pindah ke login
            document.getElementById('regName').value = '';
            document.getElementById('regEmail').value = '';
            document.getElementById('regPhone').value = '';
            document.getElementById('regPassword').value = '';
            document.getElementById('regConfirm').value = '';
            document.getElementById('tabLogin').click();
        } catch (e) {
            alert('Registrasi gagal: ' + e.message);
        } finally {
            hideLoading();
        }
    });

    window.resetPassword = function() {
        const email = prompt('Masukkan email Anda');
        if (email) {
            auth.sendPasswordResetEmail(email).then(() => alert('Email reset telah dikirim'));
        }
    };
</script>
</body>
</html>
