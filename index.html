<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HeiKasir - Owner</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.0/firebase-storage-compat.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- SheetJS -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Custom styling */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-around;
            padding: 0.5rem 0;
            z-index: 50;
            overflow-x: auto;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #4a5568;
            font-size: 0.7rem;
            cursor: pointer;
            min-width: 60px;
        }
        .nav-item.active {
            color: #001f3f;
            font-weight: 600;
        }
        .nav-item i {
            font-size: 1.25rem;
            margin-bottom: 0.125rem;
        }
        .content {
            padding-bottom: 5rem;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-card {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .lock-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255,255,255,0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 200;
        }
        .btn-navy {
            background-color: #001f3f;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            transition: 0.2s;
        }
        .btn-navy:hover {
            background-color: #003366;
        }
        .btn-outline-navy {
            border: 1px solid #001f3f;
            color: #001f3f;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
        }
        .btn-outline-navy:hover {
            background-color: #e6f0ff;
        }
        .dark {
            background-color: #1a202c;
            color: #f7fafc;
        }
        .dark .bg-white {
            background-color: #2d3748;
        }
        .tab {
            display: inline-block;
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }
        .tab.active {
            border-bottom-color: #001f3f;
            font-weight: 600;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased">

<!-- Overlay Lisensi -->
<div id="lockOverlay" class="lock-overlay hidden">
    <i class="fas fa-lock text-6xl text-navy-800 mb-4"></i>
    <h2 class="text-2xl font-bold mb-2">Akses Terkunci</h2>
    <p id="lockMessage" class="text-gray-600 mb-4">Lisensi tidak aktif</p>
    <button onclick="window.location.reload()" class="btn-navy">Coba Lagi</button>
</div>

<!-- Modal Container -->
<div id="modalContainer" class="hidden"></div>

<!-- Konten Utama (setelah login & lisensi aktif) -->
<div id="appContent" class="hidden">
    <!-- Bottom Navigation (8 item) -->
    <div class="bottom-nav" id="bottomNav">
        <div class="nav-item active" data-page="dashboard"><i class="fas fa-home"></i><span>Beranda</span></div>
        <div class="nav-item" data-page="outlets"><i class="fas fa-store"></i><span>Outlet</span></div>
        <div class="nav-item" data-page="employees"><i class="fas fa-users"></i><span>Pegawai</span></div>
        <div class="nav-item" data-page="menu"><i class="fas fa-utensils"></i><span>Menu</span></div>
        <div class="nav-item" data-page="stock"><i class="fas fa-boxes"></i><span>Stok</span></div>
        <div class="nav-item" data-page="expenses"><i class="fas fa-money-bill"></i><span>Pengeluaran</span></div>
        <div class="nav-item" data-page="reports"><i class="fas fa-chart-bar"></i><span>Laporan</span></div>
        <div class="nav-item" data-page="profile"><i class="fas fa-user"></i><span>Profil</span></div>
    </div>
    <!-- Halaman konten -->
    <div id="pageContent" class="content p-4"></div>
</div>

<!-- Halaman Login/Registrasi -->
<div id="authContainer" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-8">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold text-navy-800">HeiKasir</h1>
            <p class="text-gray-500">Owner Panel</p>
        </div>
        <div id="authTabs" class="flex mb-4 border-b">
            <button id="tabLogin" class="flex-1 py-2 text-center font-medium border-b-2 border-navy-800">Masuk</button>
            <button id="tabRegister" class="flex-1 py-2 text-center font-medium text-gray-500">Daftar</button>
        </div>
        <div id="loginForm" class="space-y-4">
            <input type="email" id="loginEmail" placeholder="Email" class="w-full p-3 border rounded-lg">
            <input type="password" id="loginPassword" placeholder="Password" class="w-full p-3 border rounded-lg">
            <button id="loginBtn" class="w-full btn-navy py-3">Masuk</button>
            <p class="text-sm text-center text-gray-500">
                Lupa password? <a href="#" onclick="resetPassword()" class="text-navy-800">Reset</a>
            </p>
        </div>
        <div id="registerForm" class="space-y-4 hidden">
            <input type="text" id="regName" placeholder="Nama Lengkap" class="w-full p-3 border rounded-lg">
            <input type="email" id="regEmail" placeholder="Email" class="w-full p-3 border rounded-lg">
            <input type="tel" id="regPhone" placeholder="Nomor WA" class="w-full p-3 border rounded-lg">
            <input type="password" id="regPassword" placeholder="Password (min. 6 karakter)" class="w-full p-3 border rounded-lg">
            <input type="password" id="regConfirmPassword" placeholder="Konfirmasi Password" class="w-full p-3 border rounded-lg">
            <button id="registerBtn" class="w-full btn-navy py-3">Daftar</button>
        </div>
    </div>
</div>

<script>
    // ==================== KONFIGURASI FIREBASE ====================
    const firebaseConfig = {
        apiKey: "AIzaSyBkoz3onX4IRWium_QUjq-Nf-pnNsiMRU8",
        authDomain: "heikasir.firebaseapp.com",
        projectId: "heikasir",
        storageBucket: "heikasir.firebasestorage.app",
        messagingSenderId: "246718427847",
        appId: "1:246718427847:web:4912ff8280132f71c344e2"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    // ==================== STATE GLOBAL ====================
    let currentUser = null;
    let currentOwnerId = null;
    let licenseData = null;
    let currentPage = 'dashboard';

    // Elemen DOM
    const authContainer = document.getElementById('authContainer');
    const appContent = document.getElementById('appContent');
    const lockOverlay = document.getElementById('lockOverlay');
    const lockMessage = document.getElementById('lockMessage');
    const pageContent = document.getElementById('pageContent');

    // ==================== AUTH LISTENER ====================
    auth.onAuthStateChanged(async (user) => {
        if (user) {
            currentUser = user;
            currentOwnerId = user.uid;
            const valid = await checkLicense();
            if (valid) {
                authContainer.classList.add('hidden');
                appContent.classList.remove('hidden');
                loadPage(currentPage);
            } else {
                authContainer.classList.add('hidden');
                appContent.classList.remove('hidden');
                lockOverlay.classList.remove('hidden');
            }
        } else {
            authContainer.classList.remove('hidden');
            appContent.classList.add('hidden');
            lockOverlay.classList.add('hidden');
        }
    });

    // ==================== CEK LISENSI ====================
    async function checkLicense() {
        if (!currentUser) return false;
        const ownerId = currentUser.uid;
        try {
            const doc = await db.collection('Master_Owners').doc(ownerId).get();
            if (!doc.exists) {
                lockMessage.innerText = 'Data owner tidak ditemukan. Hubungi developer.';
                return false;
            }
            const data = doc.data();
            const expiry = data.expiryDate ? data.expiryDate.toDate() : new Date(0);
            const now = new Date();
            if (data.status !== 'active') {
                lockMessage.innerText = 'Lisensi belum aktif. Hubungi developer.';
                return false;
            }
            if (expiry < now) {
                lockMessage.innerText = 'Masa aktif lisensi telah habis.';
                return false;
            }
            // Simpan di localStorage untuk offline check (opsional)
            localStorage.setItem('hei_license', JSON.stringify({ expiry: expiry.getTime(), status: data.status }));
            return true;
        } catch (e) {
            console.error(e);
            lockMessage.innerText = 'Gagal memeriksa lisensi. Periksa koneksi.';
            return false;
        }
    }

    // ==================== NAVIGASI ====================
    document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', (e) => {
            document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
            item.classList.add('active');
            currentPage = item.dataset.page;
            loadPage(currentPage);
        });
    });

    function loadPage(page) {
        switch(page) {
            case 'dashboard': renderDashboard(); break;
            case 'outlets': renderOutlets(); break;
            case 'employees': renderEmployees(); break;
            case 'menu': renderMenu(); break;
            case 'stock': renderStock(); break;
            case 'expenses': renderExpenses(); break;
            case 'reports': renderReports(); break;
            case 'profile': renderProfile(); break;
            default: renderDashboard();
        }
    }

    // ==================== DASHBOARD ====================
    let incomeToday = 0, expenseToday = 0, profitToday = 0, voidToday = 0;
    let incomeChart;

    function renderDashboard() {
        pageContent.innerHTML = `
            <h1 class="text-2xl font-bold mb-4">Dashboard</h1>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-white p-4 rounded-lg shadow">
                    <div class="flex items-center justify-between"><span class="text-gray-500">Pemasukan</span><i class="fas fa-arrow-up text-green-500"></i></div>
                    <div class="text-2xl font-bold" id="incomeToday">Rp 0</div>
                </div>
                <div class="bg-white p-4 rounded-lg shadow">
                    <div class="flex items-center justify-between"><span class="text-gray-500">Pengeluaran</span><i class="fas fa-arrow-down text-red-500"></i></div>
                    <div class="text-2xl font-bold" id="expenseToday">Rp 0</div>
                </div>
                <div class="bg-white p-4 rounded-lg shadow">
                    <div class="flex items-center justify-between"><span class="text-gray-500">Profit</span><i class="fas fa-chart-line text-blue-500"></i></div>
                    <div class="text-2xl font-bold" id="profitToday">Rp 0</div>
                </div>
                <div class="bg-white p-4 rounded-lg shadow">
                    <div class="flex items-center justify-between"><span class="text-gray-500">Void</span><i class="fas fa-times text-red-500"></i></div>
                    <div class="text-2xl font-bold" id="voidToday">0</div>
                </div>
            </div>
            <div class="grid md:grid-cols-2 gap-6 mb-6">
                <div class="bg-white p-4 rounded-lg shadow">
                    <h2 class="font-semibold mb-2">Perkembangan 7 Hari</h2>
                    <canvas id="incomeChart" height="200"></canvas>
                </div>
                <div class="bg-white p-4 rounded-lg shadow">
                    <h2 class="font-semibold mb-2">Menu Favorit</h2>
                    <ul id="topMenuList" class="space-y-2"></ul>
                </div>
            </div>
            <div class="bg-white p-4 rounded-lg shadow">
                <h2 class="font-semibold mb-2">Stok Menipis</h2>
                <div id="stockLimitList" class="space-y-2"></div>
            </div>
        `;

        const today = new Date(); today.setHours(0,0,0,0);
        const tomorrow = new Date(today); tomorrow.setDate(tomorrow.getDate() + 1);

        // Pemasukan & void
        const transQuery = db.collection('Owners').doc(currentOwnerId).collection('Transactions')
            .where('timestamp', '>=', today).where('timestamp', '<', tomorrow);
        const unsubTrans = transQuery.onSnapshot(snapshot => {
            incomeToday = 0; voidToday = 0;
            snapshot.forEach(doc => {
                const data = doc.data();
                if (!data.isVoid) incomeToday += data.totalPayment || 0;
                else voidToday++;
            });
            updateDashboardNumbers();
        });

        // Pengeluaran (non-stok)
        const expQuery = db.collection('Owners').doc(currentOwnerId).collection('Expenses')
            .where('timestamp', '>=', today).where('timestamp', '<', tomorrow)
            .where('isStockPurchase', '==', false);
        const unsubExp = expQuery.onSnapshot(snapshot => {
            expenseToday = 0;
            snapshot.forEach(doc => expenseToday += doc.data().amount || 0);
            updateDashboardNumbers();
        });

        loadChartData();
        loadTopMenu();
        loadStockLimit();

        function updateDashboardNumbers() {
            profitToday = incomeToday - expenseToday; // sederhana, belum dikurangi HPP
            document.getElementById('incomeToday').innerText = formatRupiah(incomeToday);
            document.getElementById('expenseToday').innerText = formatRupiah(expenseToday);
            document.getElementById('profitToday').innerText = formatRupiah(profitToday);
            document.getElementById('voidToday').innerText = voidToday;
        }
    }

    async function loadChartData() {
        const labels = [], data = [];
        for (let i = 6; i >= 0; i--) {
            const d = new Date(); d.setDate(d.getDate() - i); d.setHours(0,0,0,0);
            const next = new Date(d); next.setDate(d.getDate() + 1);
            labels.push(d.toLocaleDateString('id-ID', { weekday:'short', day:'numeric' }));
            const snap = await db.collection('Owners').doc(currentOwnerId).collection('Transactions')
                .where('timestamp', '>=', d).where('timestamp', '<', next).where('isVoid', '==', false).get();
            let total = 0;
            snap.forEach(doc => total += doc.data().totalPayment || 0);
            data.push(total);
        }
        if (incomeChart) incomeChart.destroy();
        const ctx = document.getElementById('incomeChart').getContext('2d');
        incomeChart = new Chart(ctx, {
            type: 'line',
            data: { labels, datasets: [{ label: 'Pemasukan', data, borderColor: '#001f3f', backgroundColor: 'rgba(0,31,63,0.1)', tension: 0.3 }] },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });
    }

    async function loadTopMenu() {
        const thirtyDaysAgo = new Date(); thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
        const snap = await db.collection('Owners').doc(currentOwnerId).collection('Transactions')
            .where('timestamp', '>=', thirtyDaysAgo).where('isVoid', '==', false).get();
        const menuCount = {};
        snap.forEach(doc => {
            (doc.data().items || []).forEach(item => {
                menuCount[item.name] = (menuCount[item.name] || 0) + item.qty;
            });
        });
        const sorted = Object.entries(menuCount).sort((a,b) => b[1] - a[1]).slice(0,5);
        const list = document.getElementById('topMenuList');
        list.innerHTML = sorted.map(([name, qty]) => `<li class="flex justify-between"><span>${name}</span><span class="font-semibold">${qty} terjual</span></li>`).join('');
    }

    async function loadStockLimit() {
        const snap = await db.collection('Owners').doc(currentOwnerId).collection('Ingredients').get();
        const list = document.getElementById('stockLimitList');
        list.innerHTML = '';
        snap.forEach(doc => {
            const ing = doc.data();
            if (ing.currentStock <= ing.minStock) {
                list.innerHTML += `
                    <div class="flex justify-between items-center">
                        <span>${ing.name} (${ing.currentStock} ${ing.unit})</span>
                        <button onclick="showStockInModal('${doc.id}')" class="text-sm btn-outline-navy py-1 px-2">Stok Masuk</button>
                    </div>
                `;
            }
        });
    }

    // ==================== OUTLET ====================
    function renderOutlets() {
        pageContent.innerHTML = `
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-2xl font-bold">Outlet</h1>
                <button onclick="showAddOutletModal()" class="btn-navy"><i class="fas fa-plus mr-1"></i>Tambah</button>
            </div>
            <div id="outletGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        `;
        loadOutlets();
    }

    async function loadOutlets() {
        const snap = await db.collection('Owners').doc(currentOwnerId).collection('Outlets').get();
        const grid = document.getElementById('outletGrid');
        grid.innerHTML = '';
        snap.forEach(doc => {
            const outlet = doc.data();
            grid.innerHTML += `
                <div class="bg-white p-4 rounded-lg shadow">
                    <h3 class="font-bold">${outlet.name}</h3>
                    <p class="text-sm text-gray-600">${outlet.address || '-'}</p>
                    <p class="text-sm">Stok: ${outlet.stockMode == 'global' ? 'Global' : 'Lokal'}</p>
                    <div class="flex mt-2 space-x-2">
                        <button onclick="editOutlet('${doc.id}')" class="text-sm btn-outline-navy py-1 px-2">Edit</button>
                        <button onclick="deleteOutlet('${doc.id}')" class="text-sm text-red-600"><i class="fas fa-trash"></i></button>
                    </div>
                </div>
            `;
        });
    }

    function showAddOutletModal() {
        showModal(`
            <h2 class="text-xl font-bold mb-4">Tambah Outlet</h2>
            <input type="text" id="outletName" placeholder="Nama Outlet" class="w-full p-2 border rounded mb-3">
            <input type="text" id="outletAddress" placeholder="Alamat" class="w-full p-2 border rounded mb-3">
            <input type="text" id="outletPhone" placeholder="Telepon" class="w-full p-2 border rounded mb-3">
            <div class="mb-3">
                <label class="block mb-1">Mode Stok</label>
                <label class="inline-flex items-center mr-4"><input type="radio" name="stockMode" value="global" checked> Global</label>
                <label class="inline-flex items-center"><input type="radio" name="stockMode" value="local"> Lokal</label>
            </div>
            <button onclick="saveOutlet()" class="btn-navy w-full">Simpan</button>
        `);
    }

    async function saveOutlet() {
        const name = document.getElementById('outletName').value;
        const address = document.getElementById('outletAddress').value;
        const phone = document.getElementById('outletPhone').value;
        const stockMode = document.querySelector('input[name="stockMode"]:checked').value;
        if (!name) return alert('Nama harus diisi');
        await db.collection('Owners').doc(currentOwnerId).collection('Outlets').add({
            name, address, phone, stockMode,
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        closeModal();
        loadOutlets();
    }

    function editOutlet(id) {
        alert('Fitur edit outlet akan segera hadir');
    }

    function deleteOutlet(id) {
        if (confirm('Hapus outlet ini?')) {
            db.collection('Owners').doc(currentOwnerId).collection('Outlets').doc(id).delete();
            loadOutlets();
        }
    }

    // ==================== PEGAWAI ====================
    function renderEmployees() {
        pageContent.innerHTML = `
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-2xl font-bold">Pegawai</h1>
                <button onclick="showAddEmployeeModal()" class="btn-navy"><i class="fas fa-plus mr-1"></i>Tambah</button>
            </div>
            <div id="employeeTable"></div>
        `;
        loadEmployees();
    }

    async function loadEmployees() {
        const snap = await db.collection('Owners').doc(currentOwnerId).collection('Employees').get();
        let html = '<table class="w-full"><thead><tr class="bg-gray-100"><th class="p-2 text-left">Nama</th><th>Outlet</th><th>Role</th><th>Shift</th><th>Status</th><th>Aksi</th></tr></thead><tbody>';
        snap.forEach(doc => {
            const emp = doc.data();
            html += `<tr class="border-b">
                <td class="p-2">${emp.name}</td>
                <td class="p-2">${emp.outletId}</td>
                <td class="p-2">${emp.role}</td>
                <td class="p-2">${emp.shift || '-'}</td>
                <td class="p-2">${emp.isActive ? 'Aktif' : 'Nonaktif'}</td>
                <td class="p-2">
                    <button onclick="editEmployee('${doc.id}')" class="text-blue-600 mr-2"><i class="fas fa-edit"></i></button>
                    <button onclick="resetPinEmployee('${doc.id}')" class="text-green-600"><i class="fas fa-key"></i></button>
                </td>
            </tr>`;
        });
        html += '</tbody></table>';
        document.getElementById('employeeTable').innerHTML = html;
    }

    function showAddEmployeeModal() {
        // Load outlets for dropdown
        db.collection('Owners').doc(currentOwnerId).collection('Outlets').get().then(snap => {
            let options = '';
            snap.forEach(doc => options += `<option value="${doc.id}">${doc.data().name}</option>`);
            showModal(`
                <h2 class="text-xl font-bold mb-4">Tambah Pegawai</h2>
                <input type="text" id="empName" placeholder="Nama" class="w-full p-2 border rounded mb-3">
                <input type="text" id="empPhone" placeholder="Nomor WA" class="w-full p-2 border rounded mb-3">
                <select id="empOutlet" class="w-full p-2 border rounded mb-3">${options}</select>
                <select id="empRole" class="w-full p-2 border rounded mb-3">
                    <option value="kasir">Kasir</option>
                    <option value="head">Kepala Toko</option>
                </select>
                <select id="empShift" class="w-full p-2 border rounded mb-3">
                    <option value="pagi">Pagi</option>
                    <option value="siang">Siang</option>
                    <option value="malam">Malam</option>
                </select>
                <input type="number" id="empSalary" placeholder="Gaji" class="w-full p-2 border rounded mb-3">
                <input type="password" id="empPin" placeholder="PIN (4-6 digit)" class="w-full p-2 border rounded mb-3">
                <input type="password" id="empPinConfirm" placeholder="Konfirmasi PIN" class="w-full p-2 border rounded mb-3">
                <button onclick="saveEmployee()" class="btn-navy w-full">Simpan</button>
            `);
        });
    }

    async function saveEmployee() {
        const name = document.getElementById('empName').value;
        const phone = document.getElementById('empPhone').value;
        const outletId = document.getElementById('empOutlet').value;
        const role = document.getElementById('empRole').value;
        const shift = document.getElementById('empShift').value;

    async function saveMenu() {
        // Collect data
        const name = document.getElementById('menuName').value;
        const category = document.getElementById('menuCategory').value;
        const unit = document.getElementById('menuUnit').value;
        const variant = document.getElementById('menuVariant').value;
        const prices = {
            tunai: parseFloat(document.getElementById('priceTunai').value) || 0,
            transfer: parseFloat(document.getElementById('priceTransfer').value) || 0,
            gofood: parseFloat(document.getElementById('priceGofood').value) || 0,
            shopeefood: parseFloat(document.getElementById('priceShopeefood').value) || 0
        };
        const discounts = {
            gofood: parseFloat(document.getElementById('discountGofood').value) || 0,
            shopeefood: parseFloat(document.getElementById('discountShopeefood').value) || 0
        };
        const taxPpn = parseFloat(document.getElementById('taxPpn').value) || 0;

        // Recipe
        const recipe = [];
        const ingredientRows = document.querySelectorAll('#recipeContainer .flex');
        ingredientRows.forEach(row => {
            const ingSelect = row.querySelector('.recipe-ingredient');
            const qty = parseFloat(row.querySelector('.recipe-qty').value);
            if (ingSelect.value && qty) {
                recipe.push({ ingId: ingSelect.value, qty });
            }
        });

        // Calculate HPP
        let hpp = 0;
        for (let item of recipe) {
            const ingDoc = await db.collection('Owners').doc(currentOwnerId).collection('Ingredients').doc(item.ingId).get();
            if (ingDoc.exists) {
                hpp += (ingDoc.data().avgBuyPrice || 0) * item.qty;
            }
        }
        document.getElementById('calculatedHpp').value = hpp;

        // Save menu
        await db.collection('Owners').doc(currentOwnerId).collection('Menu').add({
            name, category, unit, variant, prices, discounts, taxPpn, recipe,
            calculatedHpp: hpp,
            gridIndex: 0,
            isActive: true,
            imageUrl: '',
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        alert('Menu ditambahkan');
        closeModal();
        loadMenuList();
    }

    async function syncHpp() {
        // Update HPP for all menus based on latest ingredient prices
        const menusSnap = await db.collection('Owners').doc(currentOwnerId).collection('Menu').get();
        const batch = db.batch();
        for (const doc of menusSnap.docs) {
            const menu = doc.data();
            let hpp = 0;
            if (menu.recipe) {
                for (const item of menu.recipe) {
                    const ingDoc = await db.collection('Owners').doc(currentOwnerId).collection('Ingredients').doc(item.ingId).get();
                    if (ingDoc.exists) {
                        hpp += (ingDoc.data().avgBuyPrice || 0) * item.qty;
                    }
                }
            }
            batch.update(doc.ref, { calculatedHpp: hpp });
        }
        await batch.commit();
        alert('HPP semua menu telah disinkronisasi');
    }

    async function saveIngredient() {
        const name = document.getElementById('ingName').value;
        const unit = document.getElementById('ingUnit').value;
        const stock = parseFloat(document.getElementById('ingStock').value) || 0;
        const price = parseFloat(document.getElementById('ingPrice').value) || 0;
        const min = parseFloat(document.getElementById('ingMin').value) || 0;
        if (!name || !unit) return alert('Isi nama dan satuan');
        const ingRef = db.collection('Owners').doc(currentOwnerId).collection('Ingredients').doc();
        const batch = db.batch();
        batch.set(ingRef, {
            name, unit, currentStock: stock, minStock: min,
            avgBuyPrice: price, lastPurchasePrice: price,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        // If stock > 0, create expense
        if (stock > 0) {
            const expRef = db.collection('Owners').doc(currentOwnerId).collection('Expenses').doc();
            batch.set(expRef, {
                expId: expRef.id,
                outletId: 'global',
                category: 'Belanja Stok',
                itemName: `Pembelian ${name}`,
                amount: stock * price,
                isStockPurchase: true,
                stockDetails: { ingId: ingRef.id, addedQty: stock, purchasePricePerUnit: price },
                inputBy: 'owner',
                inputById: currentOwnerId,
                notes: 'Stok awal',
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
        }
        await batch.commit();
        alert('Bahan ditambahkan');
        closeModal();
        loadIngredients();
    }

    async function processStockIn(ingId) {
        const qty = parseFloat(document.getElementById('stockQty').value);
        const price = parseFloat(document.getElementById('stockPrice').value);
        const notes = document.getElementById('stockNotes').value;
        if (!qty || !price) return alert('Isi jumlah dan harga');
        const ingRef = db.collection('Owners').doc(currentOwnerId).collection('Ingredients').doc(ingId);
        const ingDoc = await ingRef.get();
        const ing = ingDoc.data();
        const currentStock = ing.currentStock;
        const avgPrice = ing.avgBuyPrice || 0;
        const newAvgPrice = ((currentStock * avgPrice) + (qty * price)) / (currentStock + qty);
        const batch = db.batch();
        batch.update(ingRef, {
            currentStock: currentStock + qty,
            avgBuyPrice: newAvgPrice,
            lastPurchasePrice: price,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        const expRef = db.collection('Owners').doc(currentOwnerId).collection('Expenses').doc();
        batch.set(expRef, {
            expId: expRef.id,
            outletId: 'global',
            category: 'Belanja Stok',
            itemName: `Pembelian ${ing.name}`,
            amount: qty * price,
            isStockPurchase: true,
            stockDetails: { ingId, addedQty: qty, purchasePricePerUnit: price },
            inputBy: 'owner',
            inputById: currentOwnerId,
            notes,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
        await batch.commit();
        alert('Stok berhasil ditambahkan');
        closeModal();
        loadIngredients();
        loadStockLimit(); // refresh dashboard if needed
    }

        `;

    async function exportExcel() {
        const period = document.getElementById('reportPeriod').value;
        let start, end;
        const now = new Date();
        if (period === 'today') {
            start = new Date(now.setHours(0,0,0,0));
            end = new Date(now.setHours(23,59,59,999));
        } else if (period === 'yesterday') {
            start = new Date(now.setDate(now.getDate()-1)); start.setHours(0,0,0,0);
            end = new Date(now.setHours(23,59,59,999));
        } else if (period === 'week') {
            start = new Date(now.setDate(now.getDate()-7)); start.setHours(0,0,0,0);
            end = new Date();
        } else if (period === 'month') {
            start = new Date(now.getFullYear(), now.getMonth(), 1);
            end = new Date(now.getFullYear(), now.getMonth()+1, 0, 23,59,59);
        } else if (period === 'custom') {
            start = new Date(document.getElementById('startDate').value);
            end = new Date(document.getElementById('endDate').value);
            end.setHours(23,59,59);
        }
        // Ambil data transaksi
        const transSnap = await db.collection('Owners').doc(currentOwnerId).collection('Transactions')
            .where('timestamp', '>=', start).where('timestamp', '<=', end).get();
        const expensesSnap = await db.collection('Owners').doc(currentOwnerId).collection('Expenses')
            .where('timestamp', '>=', start).where('timestamp', '<=', end).get();
        const ingredientsSnap = await db.collection('Owners').doc(currentOwnerId).collection('Ingredients').get();

        // Buat workbook
        const wb = XLSX.utils.book_new();

        // Sheet Ringkasan Laba Rugi
        let totalPenjualan = 0, totalHPP = 0, totalExpense = 0;
        transSnap.forEach(doc => {
            const data = doc.data();
            if (!data.isVoid) {
                totalPenjualan += data.totalPayment || 0;
                totalHPP += data.totalHpp || 0;
            }
        });
        expensesSnap.forEach(doc => {
            const data = doc.data();
            if (!data.isStockPurchase) totalExpense += data.amount || 0;
        });
        const labaKotor = totalPenjualan - totalHPP;
        const labaBersih = labaKotor - totalExpense;
        const sheetRingkasan = XLSX.utils.aoa_to_sheet([
            ['Ringkasan Laba Rugi'],
            ['Deskripsi', 'Nilai'],
            ['Total Penjualan', totalPenjualan],
            ['Total HPP Terjual', totalHPP],
            ['Laba Kotor', labaKotor],
            ['Total Pengeluaran', totalExpense],
            ['Laba Bersih', labaBersih]
        ]);
        XLSX.utils.book_append_sheet(wb, sheetRingkasan, 'Ringkasan');

        // Sheet Detail Transaksi
        const transData = [['No Invoice', 'Tanggal', 'Jam', 'Kasir', 'Item', 'Qty', 'Harga', 'Total', 'HPP', 'Profit']];
        transSnap.forEach(doc => {
            const t = doc.data();
            const tgl = t.timestamp ? new Date(t.timestamp.seconds*1000).toLocaleDateString('id-ID') : '';
            const jam = t.timestamp ? new Date(t.timestamp.seconds*1000).toLocaleTimeString('id-ID') : '';
            t.items.forEach(item => {
                transData.push([
                    t.invoiceNo, tgl, jam, t.cashierName, item.name, item.qty,
                    item.price, item.subtotal, item.hppAtTime, item.subtotal - (item.hppAtTime * item.qty)
                ]);
            });
        });
        const sheetTrans = XLSX.utils.aoa_to_sheet(transData);
        XLSX.utils.book_append_sheet(wb, sheetTrans, 'Transaksi');

        // Sheet Pengeluaran
        const expData = [['Tanggal', 'Kategori', 'Keterangan', 'Nominal', 'Tipe']];
        expensesSnap.forEach(doc => {
            const e = doc.data();
            const tgl = e.timestamp ? new Date(e.timestamp.seconds*1000).toLocaleDateString('id-ID') : '';
            expData.push([tgl, e.category, e.itemName, e.amount, e.isStockPurchase ? 'Aset' : 'Beban']);
        });
        const sheetExp = XLSX.utils.aoa_to_sheet(expData);
        XLSX.utils.book_append_sheet(wb, sheetExp, 'Pengeluaran');

        // Sheet Stok
        const stokData = [['Nama Bahan', 'Satuan', 'Stok Akhir', 'Min Stok']];
        ingredientsSnap.forEach(doc => {
            const i = doc.data();
            stokData.push([i.name, i.unit, i.currentStock, i.minStock]);
        });
        const sheetStok = XLSX.utils.aoa_to_sheet(stokData);
        XLSX.utils.book_append_sheet(wb, sheetStok, 'Stok');

        // Sheet Menu Terjual
        const menuCount = {};
        transSnap.forEach(doc => {
            const t = doc.data();
            if (!t.isVoid) {
                t.items.forEach(item => {
                    const key = item.name;
                    if (!menuCount[key]) menuCount[key] = { qty:0, omzet:0, hpp:0 };
                    menuCount[key].qty += item.qty;
                    menuCount[key].omzet += item.subtotal;
                    menuCount[key].hpp += (item.hppAtTime * item.qty);
                });
            }
        });
        const menuData = [['Nama Menu', 'Qty Terjual', 'Omzet', 'HPP', 'Profit']];
        Object.entries(menuCount).forEach(([name, val]) => {
            menuData.push([name, val.qty, val.omzet, val.hpp, val.omzet - val.hpp]);
        });
        const sheetMenu = XLSX.utils.aoa_to_sheet(menuData);
        XLSX.utils.book_append_sheet(wb, sheetMenu, 'Menu Terjual');

        // Export
        XLSX.writeFile(wb, `laporan_${start.toISOString().slice(0,10)}.xlsx`);
    }

    function showModal(html) {

    function closeModal(e) {

            document.getElementById('modalContainer').classList.add('hidden');

        }
    }

    document.getElementById('registerBtn').addEventListener('click', async () => {

            await db.collection('Master_Owners').doc(user.uid).set({
                ownerId: user.uid,

                name,

                status: 'pending',
                registeredAt: firebase.firestore.FieldValue.serverTimestamp()

    });
