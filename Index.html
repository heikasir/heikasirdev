<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HeiKasir - Master Developer</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <!-- Chart.js untuk grafik -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <!-- CryptoJS (untuk hash PIN, tidak dipakai di master) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f5f5f5;
        }

        /* Login */
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #0B1E33;
        }

        .login-form {
            background: white;
            padding: 40px;
            border-radius: 8px;
            width: 350px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .login-form h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #0B1E33;
        }

        .login-form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .login-form button {
            width: 100%;
            padding: 10px;
            background-color: #0B1E33;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .login-form .register-link {
            text-align: center;
            margin-top: 10px;
        }

        .login-form .register-link a {
            color: #0B1E33;
            text-decoration: none;
            font-size: 14px;
        }

        .login-form .register-link a:hover {
            text-decoration: underline;
        }

        .error {
            color: red;
            margin-bottom: 10px;
            text-align: center;
        }

        /* App Layout */
        .app {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 250px;
            background-color: #0B1E33;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px 0;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid #2a3f5e;
            margin-bottom: 20px;
        }

        .sidebar nav {
            flex: 1;
        }

        .sidebar nav a {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: #ddd;
            text-decoration: none;
            transition: background 0.3s;
            cursor: pointer;
        }

        .sidebar nav a:hover,
        .sidebar nav a.active {
            background-color: #1a2f4a;
            color: white;
        }

        .sidebar nav a .icon {
            margin-right: 10px;
            font-size: 18px;
        }

        .logout {
            padding: 20px;
            border-top: 1px solid #2a3f5e;
        }

        .logout button {
            width: 100%;
            padding: 10px;
            background-color: #c0392b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .header {
            background-color: white;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content {
            padding: 20px;
            background-color: #fafafa;
            flex: 1;
        }

        /* Cards */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .card p {
            font-size: 24px;
            font-weight: bold;
            color: #0B1E33;
        }

        /* Table */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-top: 20px;
        }

        .data-table th {
            background-color: #0B1E33;
            color: white;
            padding: 12px;
            text-align: left;
        }

        .data-table td {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }

        .data-table tr:hover {
            background-color: #f5f5f5;
        }

        .data-table button {
            margin-right: 5px;
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }

        .btn-edit {
            background-color: #2980b9;
            color: white;
        }

        .btn-delete {
            background-color: #c0392b;
            color: white;
        }

        .btn-toggle {
            background-color: #f39c12;
            color: white;
        }

        .status {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            text-transform: capitalize;
        }

        .status.active {
            background-color: #27ae60;
            color: white;
        }

        .status.suspended {
            background-color: #f39c12;
            color: white;
        }

        .status.expired {
            background-color: #c0392b;
            color: white;
        }

        .status.trial {
            background-color: #3498db;
            color: white;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal {
            background: white;
            border-radius: 8px;
            width: 400px;
            max-width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #eee;
        }

        .modal-header button {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-body label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .modal-body input,
        .modal-body select {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .modal-body button {
            width: 100%;
            padding: 10px;
            background-color: #0B1E33;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        /* Chat */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 10px;
            background: white;
            border-radius: 5px;
            height: 400px;
        }

        .message {
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 5px;
        }

        .message.user {
            background-color: #0B1E33;
            color: white;
            text-align: right;
        }

        .message.assistant {
            background-color: #f0f0f0;
            color: #333;
        }

        .typing {
            color: #888;
            font-style: italic;
            padding: 5px;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .input-area button {
            padding: 10px 20px;
            background-color: #0B1E33;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .suggestions {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .suggestion-chip {
            background-color: #e0e0e0;
            padding: 5px 10px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }

        .suggestion-chip:hover {
            background-color: #0B1E33;
            color: white;
        }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        // Firebase configuration (ganti dengan milik Anda)
        const firebaseConfig = {
            apiKey: "AIzaSyBkoz3onX4IRWium_QUjq-Nf-pnNsiMRU8",
            authDomain: "heikasir.firebaseapp.com",
            projectId: "heikasir",
            storageBucket: "heikasir.firebasestorage.app",
            messagingSenderId: "246718427847",
            appId: "1:246718427847:web:4912ff8280132f71c344e2"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Gemini API Key (ganti dengan milik sendiri)
        const GEMINI_API_KEY = 'AIzaSyBjNPgHBfN2qiKrj9PNt3mjteu2Butt5wE'; // GANTI
        const GEMINI_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${GEMINI_API_KEY}`;

        // State management
        let currentUser = null;
        let currentView = 'dashboard';
        let ownersData = [];
        let revenuesData = [];
        let logsData = [];
        let expensesData = [];
        let chatMessages = [];
        let geminiUsage = [];

        // Elemen root
        const app = document.getElementById('app');

        // Render function
        function render() {
            if (!currentUser) {
                renderLogin();
            } else {
                renderApp();
            }
        }

        // ================== LOGIN & REGISTRASI ==================
        function renderLogin() {
            app.innerHTML = `
                <div class="login-container">
                    <div class="login-form">
                        <h2>Login Developer</h2>
                        <div id="login-error" class="error"></div>
                        <input type="email" id="email" placeholder="Email" required>
                        <input type="password" id="password" placeholder="Password" required>
                        <button onclick="handleLogin()">Masuk</button>
                        <div class="register-link">
                            <a href="#" onclick="showRegisterModal()">Belum punya akun? Daftar Developer</a>
                        </div>
                    </div>
                </div>
                <!-- Modal Registrasi Developer -->
                <div id="registerModal" class="modal-overlay" style="display:none;">
                    <div class="modal">
                        <div class="modal-header">
                            <h3>Registrasi Developer</h3>
                            <button onclick="closeModal('registerModal')">&times;</button>
                        </div>
                        <div class="modal-body">
                            <div id="register-error" class="error" style="margin-bottom:10px;"></div>
                            <label>Nama Lengkap</label>
                            <input type="text" id="regName" required>
                            <label>Email</label>
                            <input type="email" id="regEmail" required>
                            <label>Password</label>
                            <input type="password" id="regPassword" required>
                            <label>Kode Rahasia</label>
                            <input type="password" id="regSecret" placeholder="Masukkan kode rahasia" required>
                            <button onclick="handleRegister()">Daftar</button>
                        </div>
                    </div>
                </div>
            `;
        }

        window.showRegisterModal = () => {
            document.getElementById('registerModal').style.display = 'flex';
        };

        window.closeModal = (id) => {
            document.getElementById(id).style.display = 'none';
        };

        window.handleRegister = async () => {
            const name = document.getElementById('regName').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const secret = document.getElementById('regSecret').value;
            const errorDiv = document.getElementById('register-error');

            if (secret !== 'HEIKASIRDEV') {
                errorDiv.innerText = 'Kode rahasia salah!';
                return;
            }

            try {
                // Buat user di Firebase Auth
                const userCred = await auth.createUserWithEmailAndPassword(email, password);
                const uid = userCred.user.uid;

                // Simpan data developer di koleksi Master_Developers
                await db.collection('Master_Developers').doc(uid).set({
                    name: name,
                    email: email,
                    createdAt: firebase.firestore.Timestamp.now()
                });

                // Opsional: perbarui profil
                await userCred.user.updateProfile({ displayName: name });

                alert('Registrasi berhasil! Silakan login.');
                closeModal('registerModal');
            } catch (err) {
                errorDiv.innerText = err.message;
            }
        };

        window.handleLogin = async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await auth.signInWithEmailAndPassword(email, password);
                // Login sukses, auth state akan memicu render ulang
            } catch (err) {
                document.getElementById('login-error').innerText = err.message;
            }
        };

        // ================== APP LAYOUT ==================
        function renderApp() {
            app.innerHTML = `
                <div class="app">
                    <div class="sidebar">
                        <div class="logo">HeiKasir Master</div>
                        <nav>
                            <a class="${currentView === 'dashboard' ? 'active' : ''}" onclick="setView('dashboard')"><span class="icon">📊</span> Dashboard</a>
                            <a class="${currentView === 'owners' ? 'active' : ''}" onclick="setView('owners')"><span class="icon">👥</span> Owners</a>
                            <a class="${currentView === 'revenue' ? 'active' : ''}" onclick="setView('revenue')"><span class="icon">💰</span> Revenue</a>
                            <a class="${currentView === 'logs' ? 'active' : ''}" onclick="setView('logs')"><span class="icon">📋</span> Logs</a>
                            <a class="${currentView === 'expenses' ? 'active' : ''}" onclick="setView('expenses')"><span class="icon">💸</span> Expenses</a>
                            <a class="${currentView === 'chat' ? 'active' : ''}" onclick="setView('chat')"><span class="icon">🤖</span> Chat AI</a>
                        </nav>
                        <div class="logout">
                            <button onclick="handleLogout()">Logout</button>
                        </div>
                    </div>
                    <div class="main-content">
                        <div class="header">
                            <h2>${getViewTitle()}</h2>
                            <div class="user-info">${currentUser.email}</div>
                        </div>
                        <div class="content" id="content-area">
                            <!-- konten dinamis -->
                        </div>
                    </div>
                </div>
            `;
            loadViewData();
        }

        function getViewTitle() {
            const titles = {
                dashboard: 'Dashboard',
                owners: 'Manajemen Owner',
                revenue: 'Pendapatan Lisensi',
                logs: 'Log Aktivitas',
                expenses: 'Pengeluaran Developer',
                chat: 'Chat AI'
            };
            return titles[currentView] || '';
        }

        window.setView = (view) => {
            currentView = view;
            renderApp();
        };

        window.handleLogout = () => {
            auth.signOut();
        };

        // ================== LOAD DATA PER VIEW ==================
        async function loadViewData() {
            const content = document.getElementById('content-area');
            if (!content) return;

            if (currentView === 'dashboard') {
                await loadDashboard(content);
            } else if (currentView === 'owners') {
                await loadOwners(content);
            } else if (currentView === 'revenue') {
                await loadRevenue(content);
            } else if (currentView === 'logs') {
                await loadLogs(content);
            } else if (currentView === 'expenses') {
                await loadExpenses(content);
            } else if (currentView === 'chat') {
                loadChat(content);
            }
        }

        // Dashboard
        async function loadDashboard(container) {
            try {
                const ownersSnap = await db.collection('Master_Owners').get();
                const totalOwners = ownersSnap.size;
                const activeOwners = ownersSnap.docs.filter(d => d.data().subscriptionStatus === 'active').length;

                const now = new Date();
                const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
                const endOfMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);
                const revenueSnap = await db.collection('Master_Revenue')
                    .where('paymentDate', '>=', startOfMonth)
                    .where('paymentDate', '<=', endOfMonth)
                    .get();
                let totalRevenue = 0;
                revenueSnap.forEach(d => totalRevenue += d.data().amount);

                const expensesSnap = await db.collection('Master_Expenses')
                    .where('timestamp', '>=', startOfMonth)
                    .where('timestamp', '<=', endOfMonth)
                    .get();
                let totalExpenses = 0;
                expensesSnap.forEach(d => totalExpenses += d.data().amount);
                const profit = totalRevenue - totalExpenses;

                const usage = ownersSnap.docs.map(d => ({
                    name: d.data().ownerName,
                    usage: d.data().geminiUsageCount || 0
                })).sort((a,b) => b.usage - a.usage).slice(0,5);

                let usageHtml = usage.map(u => `<tr><td>${u.name}</td><td>${u.usage}</td></tr>`).join('');

                container.innerHTML = `
                    <div class="cards">
                        <div class="card"><h3>Total Owner Aktif</h3><p>${activeOwners} / ${totalOwners}</p></div>
                        <div class="card"><h3>Pendapatan Bulan Ini</h3><p>Rp ${totalRevenue.toLocaleString()}</p></div>
                        <div class="card"><h3>Profit Developer</h3><p>Rp ${profit.toLocaleString()}</p></div>
                    </div>
                    <div class="gemini-usage">
                        <h3>Pengguna Gemini Teratas</h3>
                        <table class="data-table">
                            <thead><tr><th>Owner</th><th>Jumlah Panggilan</th></tr></thead>
                            <tbody>${usageHtml}</tbody>
                        </table>
                    </div>
                `;
            } catch (err) {
                container.innerHTML = `<p>Error: ${err.message}</p>`;
            }
        }

        // Owners
        async function loadOwners(container) {
            try {
                const snap = await db.collection('Master_Owners').get();
                ownersData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                let rows = '';
                ownersData.forEach(owner => {
                    const expiry = owner.expiryDate ? new Date(owner.expiryDate.seconds * 1000).toLocaleDateString() : '-';
                    rows += `
                        <tr>
                            <td>${owner.ownerName || ''}</td>
                            <td>${owner.email || ''}</td>
                            <td>${expiry}</td>
                            <td>${owner.maxOutlets || 1}</td>
                            <td><span class="status ${owner.subscriptionStatus}">${owner.subscriptionStatus}</span></td>
                            <td>
                                <button class="btn-edit" onclick="editOwner('${owner.id}')">Edit</button>
                                <button class="btn-toggle" onclick="toggleOwnerStatus('${owner.id}', '${owner.subscriptionStatus}')">
                                    ${owner.subscriptionStatus === 'active' ? 'Suspend' : 'Activate'}
                                </button>
                            </td>
                        </tr>
                    `;
                });

                container.innerHTML = `
                    <h1>Manajemen Lisensi Owner</h1>
                    <button onclick="showAddOwnerModal()">Tambah Owner Baru</button>
                    <table class="data-table">
                        <thead>
                            <tr><th>Nama</th><th>Email</th><th>Expiry</th><th>Maks Outlet</th><th>Status</th><th>Aksi</th></tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>

                    <!-- Modal Tambah Owner -->
                    <div id="ownerModal" class="modal-overlay" style="display:none;">
                        <div class="modal">
                            <div class="modal-header">
                                <h3>Tambah Owner Baru</h3>
                                <button onclick="closeModal('ownerModal')">&times;</button>
                            </div>
                            <div class="modal-body">
                                <label>Email</label>
                                <input type="email" id="ownerEmail" required>
                                <label>Nama Owner</label>
                                <input type="text" id="ownerName" required>
                                <label>Jumlah Bulan Lisensi</label>
                                <input type="number" id="ownerMonths" min="1" value="1" required>
                                <label>Maks Outlet</label>
                                <input type="number" id="ownerMaxOutlets" min="1" value="1" required>
                                <button onclick="addOwner()">Simpan</button>
                            </div>
                        </div>
                    </div>

                    <!-- Modal Edit Owner -->
                    <div id="editOwnerModal" class="modal-overlay" style="display:none;">
                        <div class="modal">
                            <div class="modal-header">
                                <h3>Edit Lisensi</h3>
                                <button onclick="closeModal('editOwnerModal')">&times;</button>
                            </div>
                            <div class="modal-body">
                                <input type="hidden" id="editOwnerId">
                                <label>Expiry Date</label>
                                <input type="date" id="editExpiry">
                                <label>Maks Outlet</label>
                                <input type="number" id="editMaxOutlets" min="1">
                                <label>Status</label>
                                <select id="editStatus">
                                    <option value="active">Active</option>
                                    <option value="suspended">Suspended</option>
                                    <option value="expired">Expired</option>
                                </select>
                                <button onclick="updateOwner()">Update</button>
                            </div>
                        </div>
                    </div>
                `;
            } catch (err) {
                container.innerHTML = `<p>Error: ${err.message}</p>`;
            }
        }

        window.showAddOwnerModal = () => {
            document.getElementById('ownerModal').style.display = 'flex';
        };

        window.addOwner = async () => {
            const email = document.getElementById('ownerEmail').value;
            const name = document.getElementById('ownerName').value;
            const months = parseInt(document.getElementById('ownerMonths').value);
            const maxOutlets = parseInt(document.getElementById('ownerMaxOutlets').value);

            try {
                // Buat akun Firebase Auth untuk owner (password random, nanti reset)
                const password = Math.random().toString(36).slice(-8);
                const userCred = await auth.createUserWithEmailAndPassword(email, password);
                const uid = userCred.user.uid;

                const expiry = new Date();
                expiry.setMonth(expiry.getMonth() + months);

                await db.collection('Master_Owners').doc(uid).set({
                    ownerId: uid,
                    ownerName: name,
                    email: email,
                    maxOutlets: maxOutlets,
                    expiryDate: firebase.firestore.Timestamp.fromDate(expiry),
                    subscriptionStatus: 'active',
                    pricePerMonth: 0,
                    geminiUsageCount: 0,
                    createdAt: firebase.firestore.Timestamp.now()
                });

                await db.collection('Master_Revenue').add({
                    ownerId: uid,
                    amount: 0,
                    monthsPaid: months,
                    paymentDate: firebase.firestore.Timestamp.now(),
                    expiryDate: firebase.firestore.Timestamp.fromDate(expiry)
                });

                closeModal('ownerModal');
                alert(`Owner berhasil ditambahkan. Password sementara: ${password}`);
                loadOwners(document.getElementById('content-area'));
            } catch (err) {
                alert(err.message);
            }
        };

        window.editOwner = (id) => {
            const owner = ownersData.find(o => o.id === id);
            if (!owner) return;
            document.getElementById('editOwnerId').value = id;
            document.getElementById('editExpiry').value = owner.expiryDate ? new Date(owner.expiryDate.seconds * 1000).toISOString().slice(0,10) : '';
            document.getElementById('editMaxOutlets').value = owner.maxOutlets;
            document.getElementById('editStatus').value = owner.subscriptionStatus;
            document.getElementById('editOwnerModal').style.display = 'flex';
        };

        window.updateOwner = async () => {
            const id = document.getElementById('editOwnerId').value;
            const expiry = document.getElementById('editExpiry').value;
            const maxOutlets = parseInt(document.getElementById('editMaxOutlets').value);
            const status = document.getElementById('editStatus').value;

            const updateData = {
                maxOutlets: maxOutlets,
                subscriptionStatus: status
            };
            if (expiry) {
                updateData.expiryDate = firebase.firestore.Timestamp.fromDate(new Date(expiry));
            }

            await db.collection('Master_Owners').doc(id).update(updateData);
            closeModal('editOwnerModal');
            loadOwners(document.getElementById('content-area'));
        };

        window.toggleOwnerStatus = async (id, currentStatus) => {
            const newStatus = currentStatus === 'active' ? 'suspended' : 'active';
            await db.collection('Master_Owners').doc(id).update({ subscriptionStatus: newStatus });
            loadOwners(document.getElementById('content-area'));
        };

        // Revenue
        async function loadRevenue(container) {
            try {
                const snap = await db.collection('Master_Revenue').get();
                revenuesData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                let rows = '';
                revenuesData.forEach(rev => {
                    rows += `
                        <tr>
                            <td>${rev.ownerId || ''}</td>
                            <td>Rp ${(rev.amount || 0).toLocaleString()}</td>
                            <td>${rev.monthsPaid || 0}</td>
                            <td>${rev.paymentDate ? new Date(rev.paymentDate.seconds * 1000).toLocaleDateString() : ''}</td>
                            <td>${rev.expiryDate ? new Date(rev.expiryDate.seconds * 1000).toLocaleDateString() : ''}</td>
                        </tr>
                    `;
                });

                container.innerHTML = `
                    <h1>Pendapatan Lisensi</h1>
                    <table class="data-table">
                        <thead><tr><th>Owner ID</th><th>Jumlah</th><th>Bulan</th><th>Tanggal Bayar</th><th>Expiry Baru</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                `;
            } catch (err) {
                container.innerHTML = `<p>Error: ${err.message}</p>`;
            }
        }

        // Logs
        async function loadLogs(container) {
            try {
                const snap = await db.collection('Master_Logs').orderBy('timestamp', 'desc').limit(100).get();
                logsData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                let rows = '';
                logsData.forEach(log => {
                    rows += `
                        <tr>
                            <td>${log.timestamp ? new Date(log.timestamp.seconds * 1000).toLocaleString() : ''}</td>
                            <td>${log.ownerId || ''}</td>
                            <td>${log.action || ''}</td>
                            <td>${log.details || ''}</td>
                            <td>${log.ip || ''}</td>
                        </tr>
                    `;
                });

                container.innerHTML = `
                    <h1>Log Aktivitas Owner</h1>
                    <table class="data-table">
                        <thead><tr><th>Waktu</th><th>Owner ID</th><th>Aksi</th><th>Detail</th><th>IP</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>
                `;
            } catch (err) {
                container.innerHTML = `<p>Error: ${err.message}</p>`;
            }
        }

        // Expenses
        async function loadExpenses(container) {
            try {
                const snap = await db.collection('Master_Expenses').orderBy('timestamp', 'desc').get();
                expensesData = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

                let rows = '';
                expensesData.forEach(exp => {
                    rows += `
                        <tr>
                            <td>${exp.category || ''}</td>
                            <td>${exp.description || ''}</td>
                            <td>Rp ${(exp.amount || 0).toLocaleString()}</td>
                            <td>${exp.timestamp ? new Date(exp.timestamp.seconds * 1000).toLocaleDateString() : ''}</td>
                        </tr>
                    `;
                });

                container.innerHTML = `
                    <h1>Pengeluaran Developer</h1>
                    <button onclick="showAddExpenseModal()">Tambah Pengeluaran</button>
                    <table class="data-table">
                        <thead><tr><th>Kategori</th><th>Deskripsi</th><th>Nominal</th><th>Tanggal</th></tr></thead>
                        <tbody>${rows}</tbody>
                    </table>

                    <!-- Modal Tambah Expense -->
                    <div id="expenseModal" class="modal-overlay" style="display:none;">
                        <div class="modal">
                            <div class="modal-header">
                                <h3>Tambah Pengeluaran</h3>
                                <button onclick="closeModal('expenseModal')">&times;</button>
                            </div>
                            <div class="modal-body">
                                <label>Kategori</label>
                                <input type="text" id="expCategory" required>
                                <label>Deskripsi</label>
                                <input type="text" id="expDesc" required>
                                <label>Nominal</label>
                                <input type="number" id="expAmount" required>
                                <button onclick="addExpense()">Simpan</button>
                            </div>
                        </div>
                    </div>
                `;
            } catch (err) {
                container.innerHTML = `<p>Error: ${err.message}</p>`;
            }
        }

        window.showAddExpenseModal = () => {
            document.getElementById('expenseModal').style.display = 'flex';
        };

        window.addExpense = async () => {
            const category = document.getElementById('expCategory').value;
            const desc = document.getElementById('expDesc').value;
            const amount = parseFloat(document.getElementById('expAmount').value);

            await db.collection('Master_Expenses').add({
                category,
                description: desc,
                amount,
                timestamp: firebase.firestore.Timestamp.now()
            });

            closeModal('expenseModal');
            loadExpenses(document.getElementById('content-area'));
        };

        // Chat AI
        function loadChat(container) {
            chatMessages = [];
            container.innerHTML = `
                <div class="chat-container">
                    <h1>Chat AI Developer</h1>
                    <div class="suggestions">
                        <span class="suggestion-chip" onclick="setChatPrompt('Analisis profit developer bulan ini')">Analisis profit</span>
                        <span class="suggestion-chip" onclick="setChatPrompt('Owner mana yang paling banyak menggunakan AI?')">Top pengguna AI</span>
                        <span class="suggestion-chip" onclick="setChatPrompt('Rekomendasi untuk meningkatkan pendapatan')">Rekomendasi</span>
                    </div>
                    <div class="messages" id="chatMessages"></div>
                    <div class="input-area">
                        <input type="text" id="chatInput" placeholder="Tanya sesuatu..." onkeypress="if(event.key==='Enter') sendChatMessage()">
                        <button onclick="sendChatMessage()">Kirim</button>
                    </div>
                </div>
            `;
        }

        window.setChatPrompt = (text) => {
            document.getElementById('chatInput').value = text;
        };

        window.sendChatMessage = async () => {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;

            const messagesDiv = document.getElementById('chatMessages');
            chatMessages.push({ role: 'user', content: text });
            renderChatMessages(messagesDiv);

            input.value = '';
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerText = 'AI sedang mengetik...';
            messagesDiv.appendChild(typingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;

            try {
                // Ambil konteks data developer
                const ownersSnap = await db.collection('Master_Owners').get();
                const totalOwners = ownersSnap.size;
                const activeOwners = ownersSnap.docs.filter(d => d.data().subscriptionStatus === 'active').length;

                const revenueSnap = await db.collection('Master_Revenue').get();
                let totalRevenue = 0;
                revenueSnap.forEach(d => totalRevenue += d.data().amount);

                const expensesSnap = await db.collection('Master_Expenses').get();
                let totalExpenses = 0;
                expensesSnap.forEach(d => totalExpenses += d.data().amount);

                const context = `Data developer: total owner ${totalOwners}, aktif ${activeOwners}, total pendapatan Rp ${totalRevenue.toLocaleString()}, total pengeluaran Rp ${totalExpenses.toLocaleString()}. `;
                const prompt = context + text;

                const response = await fetch(GEMINI_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { temperature: 0.7, maxOutputTokens: 500 }
                    })
                });
                const data = await response.json();
                let reply = '';
                if (data.candidates && data.candidates[0]) {
                    reply = data.candidates[0].content.parts[0].text;
                } else {
                    reply = 'Maaf, tidak ada respons.';
                }

                document.getElementById('typingIndicator')?.remove();
                chatMessages.push({ role: 'assistant', content: reply });
                renderChatMessages(messagesDiv);
            } catch (err) {
                document.getElementById('typingIndicator')?.remove();
                chatMessages.push({ role: 'assistant', content: 'Error: ' + err.message });
                renderChatMessages(messagesDiv);
            }
        };

        function renderChatMessages(container) {
            container.innerHTML = '';
            chatMessages.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.role}`;
                div.innerText = msg.content;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        // Auth state observer
        auth.onAuthStateChanged(user => {
            currentUser = user;
            render();
        });

        // Initial render
        render();
    </script>
</body>
</html>
